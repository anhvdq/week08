name: 04 - Deploy to Production

on:
  workflow_run:
    workflows:
      - "03 - Test Staging"
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  actions: write

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest

    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' }}

    environment:
      name: production

    steps:
      - name: Download tested images
        uses: actions/download-artifact@v4
        with:
          name: tested-images
          path: ${{ runner.temp }}/tested-images
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate tested images
        id: release
        env:
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import re
          from pathlib import Path

          images = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "tested-images" / "tested-images.json").read_text()
          )
          services = {
              "frontend", "user-service", "student-service",
              "lecturer-service", "course-service", "enrollment-service",
          }
          registry = os.environ["ACR_LOGIN_SERVER"]
          if not registry or not isinstance(images, dict) or set(images) != services:
              raise SystemExit("Expected all six application images and a configured ACR registry.")

          tags = set()
          for service, image in images.items():
              prefix = f"{registry}/koalatech-{service}:"
              if not isinstance(image, str) or not image.startswith(prefix):
                  raise SystemExit(f"Unexpected image repository for {service}.")
              tag = image[len(prefix):]
              if not re.fullmatch(r"[0-9a-f]{40}", tag):
                  raise SystemExit(f"Invalid commit SHA for {service}.")
              tags.add(tag)
          if len(tags) != 1:
              raise SystemExit("Staging images must all belong to the same commit.")

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"image_tag={tags.pop()}\n")
          PYTHON

      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.image_tag }}

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Create production namespace
        run: |
          kubectl create namespace production \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Create PostgreSQL secret
        run: |
          kubectl create secret generic postgres-secret \
            --namespace production \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Get application storage connection string
        env:
          STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT_NAME }}
          RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}
        run: |
          connection=$(az storage account show-connection-string \
            --name "$STORAGE_ACCOUNT" --resource-group "$RESOURCE_GROUP" \
            --query connectionString --output tsv)
          test -n "$connection"
          echo "::add-mask::$connection"
          echo "AZURE_STORAGE_CONNECTION_STRING=$connection" >> "$GITHUB_ENV"

      - name: Create application secret
        run: |
          kubectl create secret generic application-secret \
            --namespace production \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --from-literal=JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
            --from-literal=DEFAULT_ADMIN_USERNAME="${{ secrets.DEFAULT_ADMIN_USERNAME }}" \
            --from-literal=DEFAULT_ADMIN_EMAIL="${{ secrets.DEFAULT_ADMIN_EMAIL }}" \
            --from-literal=DEFAULT_ADMIN_PASSWORD="${{ secrets.DEFAULT_ADMIN_PASSWORD }}" \
            --from-literal=AZURE_STORAGE_CONNECTION_STRING="$AZURE_STORAGE_CONNECTION_STRING" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply \
            -f kubernetes/production/

      - name: Update frontend image
        run: |
          kubectl set image deployment/frontend \
            frontend=${{ vars.ACR_LOGIN_SERVER }}/koalatech-frontend:${{ steps.release.outputs.image_tag }} \
            -n production

      - name: Update user-service image
        run: |
          kubectl set image deployment/user-service \
            user-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-user-service:${{ steps.release.outputs.image_tag }} \
            -n production

      - name: Update student-service image
        run: |
          kubectl set image deployment/student-service \
            student-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-student-service:${{ steps.release.outputs.image_tag }} \
            -n production

      - name: Update lecturer-service image
        run: |
          kubectl set image deployment/lecturer-service \
            lecturer-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-lecturer-service:${{ steps.release.outputs.image_tag }} \
            -n production

      - name: Update course-service image
        run: |
          kubectl set image deployment/course-service \
            course-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-course-service:${{ steps.release.outputs.image_tag }} \
            -n production

      - name: Update enrollment-service image
        run: |
          kubectl set image deployment/enrollment-service \
            enrollment-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-enrollment-service:${{ steps.release.outputs.image_tag }} \
            -n production

      - name: Wait for frontend rollout
        run: |
          kubectl rollout status deployment/frontend \
            -n production \
            --timeout=300s

      - name: Wait for user-service rollout
        run: |
          kubectl rollout status deployment/user-service \
            -n production \
            --timeout=300s

      - name: Wait for student-service rollout
        run: |
          kubectl rollout status deployment/student-service \
            -n production \
            --timeout=300s

      - name: Wait for lecturer-service rollout
        run: |
          kubectl rollout status deployment/lecturer-service \
            -n production \
            --timeout=300s

      - name: Wait for course-service rollout
        run: |
          kubectl rollout status deployment/course-service \
            -n production \
            --timeout=300s

      - name: Wait for enrollment-service rollout
        run: |
          kubectl rollout status deployment/enrollment-service \
            -n production \
            --timeout=300s

      - name: Show production resources
        run: |
          kubectl get pods -n production
          kubectl get services -n production
          kubectl get pvc -n production

      - name: Trigger production smoke test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run 05-production-test.yml --ref main
